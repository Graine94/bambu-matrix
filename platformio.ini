[platformio]
default_envs = esp32

; Любая плата на классическом ESP32 с 4 МБ flash (DevKit, LOLIN32 Lite, WROOM-32 и т.п.).
; Порт для прошивки PlatformIO находит сам; если нет — добавь upload_port = /dev/...
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
upload_speed = 460800
lib_deps =
    majicdesigns/MD_MAX72XX @ ^3.5.1
    arduino-libraries/ArduinoMqttClient @ ^0.1.8
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17

; Прошивка по Wi-Fi: pio run -e ota -t upload
; Через HTTP-загрузку WiFiManager (/u): не нужен входящий порт, файрвол macOS не мешает.
; Если bambu-matrix.local не находится, подставь IP платы.
[env:ota]
extends = env:esp32
upload_protocol = custom
upload_command = curl --fail -sS -m 300 -F "firmware=@$SOURCE" http://bambu-matrix.local/u -o /dev/null && echo "OTA upload OK"
